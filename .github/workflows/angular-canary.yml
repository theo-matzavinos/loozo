name: Angular canary

# Weekly, installs Angular's latest and next releases across the workspace, regenerates the
# builder schemas and runs the router's and Launch's tests, so a new Angular minor is ready to
# release when it ships (packages/angular-router/README.md, "Angular versions"). Not a required
# check. Pull requests run it only when they change the canary itself.
on:
  schedule:
    # Fridays 06:00 UTC, after Angular's midweek releases.
    - cron: "0 6 * * 5"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/angular-canary.yml
      - scripts/pin-angular.mjs

permissions:
  contents: read

concurrency:
  group: angular-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: angular-canary (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, next]
    defaults:
      run:
        working-directory: packages/angular-router
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: node scripts/pin-angular.mjs ${{ matrix.channel }}
        working-directory: .
      # The overrides change the lockfile, so it can't be frozen.
      - id: install
        run: pnpm install --no-frozen-lockfile
        working-directory: .
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      # Regenerates schemas/, failing when Angular's conditions option or option names change.
      - id: build
        run: pnpm run build
      # The schema changes a release against this Angular would ship.
      - run: git diff --stat -- schemas
      - run: pnpm test
      # From here on, each test runs even when an earlier one failed.
      - id: browsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm exec playwright install --with-deps chromium
          mkdir "$RUNNER_TEMP/evidence"
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm run test:application "$RUNNER_TEMP/evidence/application"
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm run test:filesystem "$RUNNER_TEMP/evidence/filesystem"
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm run test:navigation "$RUNNER_TEMP/evidence/navigation"
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm run test:lifecycle "$RUNNER_TEMP/evidence/lifecycle"
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm run test:ssr "$RUNNER_TEMP/evidence/ssr"
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: pnpm run test:tooling "$RUNNER_TEMP/evidence/tooling"
      # Launch pins the router exactly and releases in lockstep with it.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run build && pnpm test
        working-directory: packages/angular-launch
      # A new Angular minor on latest is the policy's cue to release; this stays red until the
      # router's @angular/build range covers it.
      - if: ${{ !cancelled() && matrix.channel == 'latest' && steps.install.outcome == 'success' }}
        run: |
          node -e '
            const range = require("./package.json").peerDependencies["@angular/build"];
            const { version } = require("@angular/build/package.json");
            const [major, minor] = range.replace(/^~/, "").split(".");

            if (!version.startsWith(`${major}.${minor}.`)) {
              console.log(`::error::Angular ${version} is out; the router supports ${range}. Release against it.`);
              process.exit(1);
            }
          '
      # The fixtures under consumer/ link the workspace's node_modules, so they stay out, also
      # through filesystem's workspace-access alias, which a failed run leaves in place.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: angular-canary-${{ matrix.channel }}-evidence
          path: |
            ${{ runner.temp }}/evidence/
            !${{ runner.temp }}/evidence/*/consumer/
            !${{ runner.temp }}/evidence/*/workspace-access/
          if-no-files-found: ignore
