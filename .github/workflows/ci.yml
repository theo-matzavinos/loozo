name: CI

# Required checks for pull requests into main: every package's build, check, typecheck
# and test, the docs-content tool's typecheck and test, Origami's commit gate
# (test:commit), the router's browser tests, its Windows and macOS runs, Launch's example proof,
# fold's consumer check and ui-sdk-angular's browser suite in each engine. The jobs after checks run only for the packages a pull request
# reaches (see affected); a skipped one passes its required check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm test
      # The docs-content tool sits outside packages/*; its tests read Origami's dist/.
      - run: pnpm --filter @loozo/docs-content run typecheck
      - run: pnpm --filter @loozo/docs-content run test

  # The packages a pull request changes and every package that depends on them, from pnpm's
  # workspace graph. A change outside every package selects the root project (the lockfile,
  # scripts/, .github/), and that or a manual run selects everything. A job below runs when its
  # output isn't "false", so it also runs when this job fails. The examples count too: the
  # router's and Origami's proofs read theirs.
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      origami: ${{ steps.select.outputs.origami }}
      fold: ${{ steps.select.outputs.fold }}
      router: ${{ steps.select.outputs.router }}
      launch: ${{ steps.select.outputs.launch }}
      ui-sdk: ${{ steps.select.outputs.ui-sdk }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - id: select
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            selected=$(pnpm ls -r --depth -1 --json --filter '...[HEAD^1]' | jq -r '.[].name')
          else
            selected=loozo
          fi

          printf 'Selected:\n%s\n' "$selected"

          reaches() {
            for name in loozo "$@"; do
              if grep -qxF "$name" <<<"$selected"; then
                echo true
                return
              fi
            done

            echo false
          }

          {
            echo "origami=$(reaches @loozo/origami-ui origami-ui-consumer)"
            echo "fold=$(reaches @loozo/fold-ui)"
            echo "router=$(reaches @loozo/angular-router angular-router-consumer)"
            echo "launch=$(reaches angular-launch-consumer)"
            echo "ui-sdk=$(reaches @loozo/ui-sdk-angular)"
          } | tee -a "$GITHUB_OUTPUT"

  origami-commit-gate:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.origami != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NG_BUILD_MAX_WORKERS: 2
    defaults:
      run:
        working-directory: packages/origami-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      # The runner is disposable, so the engines' host libraries come from apt.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Measure the reference host's font; the runner would otherwise pick DejaVu Sans.
      - run: |
          install -D tests/acceptance/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-match system-ui | grep -q LiberationSans
      - run: pnpm run test:commit
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: origami-commit-evidence
          path: packages/origami-ui/.acceptance-evidence/
          include-hidden-files: true
          if-no-files-found: ignore

  # Matrix jobs skip their steps instead of the job: a job skipped before its matrix expands
  # never reports its entries' checks, which the branch rules require by name.
  router-browser:
    needs: affected
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test: [application, filesystem, navigation, lifecycle, ssr, tooling]
    env:
      REACHED: ${{ needs.affected.outputs.router != 'false' }}
    defaults:
      run:
        working-directory: packages/angular-router
    steps:
      - if: env.REACHED != 'true'
        working-directory: .
        run: echo "This pull request doesn't reach the router; skipped."
      - if: env.REACHED == 'true'
        uses: actions/checkout@v7
      - if: env.REACHED == 'true'
        uses: pnpm/action-setup@v6
      - if: env.REACHED == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - if: env.REACHED == 'true'
        run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - if: env.REACHED == 'true'
        run: pnpm run build
      - if: env.REACHED == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: env.REACHED == 'true'
        run: pnpm run test:${{ matrix.test }} "$RUNNER_TEMP/evidence"
      # The fixture under consumer/ links the workspace's node_modules, so it stays out, also
      # through filesystem's workspace-access alias, which a failed run leaves in place.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: router-${{ matrix.test }}-evidence
          path: |
            ${{ runner.temp }}/evidence/
            !${{ runner.temp }}/evidence/consumer/
            !${{ runner.temp }}/evidence/workspace-access/
          if-no-files-found: ignore

  # The router's Node tests and filesystem proof on the other hosts; checks and router-browser
  # cover Linux. Their filesystems are case-insensitive and Windows separates paths with "\".
  router-platforms:
    needs: affected
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      REACHED: ${{ needs.affected.outputs.router != 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: packages/angular-router
    steps:
      - if: env.REACHED != 'true'
        working-directory: .
        run: echo "This pull request doesn't reach the router; skipped."
      - if: env.REACHED == 'true'
        uses: actions/checkout@v7
      - if: env.REACHED == 'true'
        uses: pnpm/action-setup@v6
      - if: env.REACHED == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - if: env.REACHED == 'true'
        run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - if: env.REACHED == 'true'
        run: pnpm run build
      - if: env.REACHED == 'true'
        run: pnpm test
      # The filesystem proof runs and reports even when a Node test failed.
      - if: ${{ !cancelled() && env.REACHED == 'true' }}
        run: pnpm exec playwright install chromium
      - if: ${{ !cancelled() && env.REACHED == 'true' }}
        run: pnpm run test:filesystem "$RUNNER_TEMP/evidence"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: router-${{ matrix.os }}-evidence
          path: |
            ${{ runner.temp }}/evidence/
            !${{ runner.temp }}/evidence/consumer/
            !${{ runner.temp }}/evidence/workspace-access/
          if-no-files-found: ignore

  # Launch's example, built and served, proven in Chromium: SSR, hydration without a second RPC,
  # outcomes, streams and channels, then its prerender builds. verify.mjs starts and stops the
  # built server itself.
  launch-browser:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.launch != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      # The router and Launch, then the example's default build, which generates first.
      - run: pnpm --filter 'angular-launch-consumer...' run build
      - run: pnpm --dir packages/angular-launch exec playwright install --with-deps chromium
      - run: pnpm --dir examples/angular-launch run verify "$RUNNER_TEMP/evidence"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launch-browser-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore

  # The SSR fixture app built eager and incremental, under Playwright in one engine per entry.
  ui-sdk-browser:
    needs: affected
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      REACHED: ${{ needs.affected.outputs.ui-sdk != 'false' }}
      UI_SDK_BROWSER: ${{ matrix.engine }}
    defaults:
      run:
        working-directory: packages/ui-sdk-angular
    steps:
      - if: env.REACHED != 'true'
        working-directory: .
        run: echo "This pull request doesn't reach ui-sdk-angular; skipped."
      - if: env.REACHED == 'true'
        uses: actions/checkout@v7
      - if: env.REACHED == 'true'
        uses: pnpm/action-setup@v6
      - if: env.REACHED == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - if: env.REACHED == 'true'
        run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      # The runner is disposable, so the engine's host libraries come from apt.
      - if: env.REACHED == 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - if: env.REACHED == 'true'
        run: pnpm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-sdk-browser-${{ matrix.engine }}-evidence
          path: packages/ui-sdk-angular/.scratch/browser-results/
          include-hidden-files: true
          if-no-files-found: ignore

  fold-consumer:
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.fold != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/fold-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - run: pnpm exec playwright install --with-deps chromium
      # Builds Origami and fold, packs them into a fresh `ng new` app, builds it and runs the smoke.
      - run: pnpm run test:consumer
