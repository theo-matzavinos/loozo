name: CI

# Required checks for pull requests into main: every package's build, check, typecheck
# and test, plus Origami's commit gate (test:commit).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm test

  origami-commit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NG_BUILD_MAX_WORKERS: 2
    defaults:
      run:
        working-directory: packages/origami-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      # The runner is disposable, so the engines' host libraries come from apt.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Measure the reference host's font; the runner would otherwise pick DejaVu Sans.
      - run: |
          install -D tests/acceptance/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-match system-ui | grep -q LiberationSans
      - run: pnpm run test:commit
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: origami-commit-evidence
          path: packages/origami-ui/.acceptance-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
