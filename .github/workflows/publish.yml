name: Publish

# Releases one package from main: bumps it to the next 0.0.x, runs the gate on
# the bumped tree, pushes the release commit and a <package>@<version> tag, then
# publishes packages/<package>/dist to npm through trusted publishing (OIDC, no token).
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        options: [angular-router, angular-launch, origami-ui]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ inputs.package }}
    outputs:
      name: ${{ steps.bump.outputs.name }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - id: bump
        run: |
          node scripts/bump-version.mjs "$PACKAGE"
          echo "name=$(jq -r .name "packages/$PACKAGE/package.json")" >> "$GITHUB_OUTPUT"
          echo "tag=$PACKAGE@$(jq -r .version "packages/$PACKAGE/package.json")" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      # The trailing ... also builds the workspace packages it depends on.
      - run: pnpm --filter "${{ steps.bump.outputs.name }}..." run build
      - run: pnpm --filter "${{ steps.bump.outputs.name }}" run --if-present check
      - run: pnpm --filter "${{ steps.bump.outputs.name }}" run typecheck
      - run: pnpm --filter "${{ steps.bump.outputs.name }}" run test
      - if: hashFiles(format('packages/{0}/tests/packed.mjs', inputs.package)) != ''
        run: node "packages/$PACKAGE/tests/packed.mjs" "$RUNNER_TEMP/packed"
      # The push fails if main moved during the run, so nothing gets published.
      - env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify --message "chore(release): $TAG" -- "packages/$PACKAGE"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

  # A separate job, so "Re-run failed jobs" retries only the publish.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - run: pnpm --filter "${{ needs.release.outputs.name }}..." run build
      - run: npm publish
        working-directory: packages/${{ inputs.package }}/dist
