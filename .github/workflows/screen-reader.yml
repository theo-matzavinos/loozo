name: Screen reader

# Optional evidence, not a required check: runs Origami's Toast, Menu, Calendar and date field
# scenarios and the Calendar markup probes under NVDA and VoiceOver through Guidepup and saves
# what each reader was asked to say. It never asserts speech; a job fails only when the reader or
# the fixture misbehaves. Pull requests run it when they change it.
on:
  pull_request:
    paths:
      - .github/workflows/screen-reader.yml
      - packages/origami-ui/tests/screen-reader/**
      - examples/origami-ui/src/fixtures/toast-speech.ts
      - examples/origami-ui/src/fixtures/menu-speech.ts
      - examples/origami-ui/src/fixtures/calendar-speech.ts
      - examples/origami-ui/src/fixtures/date-field-speech.ts
      - examples/origami-ui/src/fixtures/calendar-probe-speech.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One production-eager SSR build; the reader jobs only serve it with Node.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NG_BUILD_MAX_WORKERS: 2
    defaults:
      run:
        working-directory: packages/origami-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - run: pnpm run acceptance:prepare
      - run: sh tests/acceptance/gate-lock.sh sh -c 'cd .scratch/consumer && node ../../node_modules/@angular/cli/bin/ng.js build consumer --configuration production-eager'
      - uses: actions/upload-artifact@v7
        with:
          name: consumer-eager
          path: packages/origami-ui/.scratch/consumer/dist/consumer-eager/
          if-no-files-found: error

  speech:
    needs: build
    name: ${{ matrix.reader }} · ${{ matrix.browser }} · ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    # A reader can hang a run for hours. The specs are split in groups so each job stays well
    # inside the timeout: VoiceOver took 89 minutes for all of them in one job.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [nvda-chromium, nvda-firefox, voiceover-webkit]
        group: [toast-menu, calendar-date-field, markup-probe]
        include:
          - { target: nvda-chromium, os: windows-2025, reader: nvda, browser: chromium }
          - { target: nvda-firefox, os: windows-2025, reader: nvda, browser: firefox }
          - { target: voiceover-webkit, os: macos-26, reader: voiceover, browser: webkit }
          # Playwright file filters: the specs each group runs.
          - { group: toast-menu, specs: toast menu }
          - { group: calendar-date-field, specs: calendar date-field }
          - { group: markup-probe, specs: markup-probe }
    env:
      ORIGAMI_SR: ${{ matrix.reader }}
    defaults:
      run:
        shell: bash
        working-directory: packages/origami-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      - uses: actions/download-artifact@v8
        with:
          name: consumer-eager
          path: packages/origami-ui/.scratch/consumer/dist/consumer-eager/
      # The workspace doesn't run ffmpeg-static's download (pnpm-workspace.yaml); setup's
      # --macos-record needs the binary, so this job runs it.
      - if: runner.os == 'macOS'
        run: >-
          node -e "const { createRequire } = require('node:module');
          const setup = createRequire(require.resolve('@guidepup/setup/package.json'));
          const record = createRequire(setup.resolve('@guidepup/record/package.json'));
          require(record.resolve('ffmpeg-static/install.js'));"
      - if: runner.os == 'macOS'
        run: pnpm exec guidepup setup --ci --macos-record
      - if: runner.os == 'Windows'
        run: pnpm exec guidepup setup --ci
      - run: pnpm exec playwright install ${{ matrix.browser }}
      - run: pnpm exec guidepup install
      - run: pnpm run screen-reader:test ${{ matrix.specs }} --project ${{ matrix.target }}
      - if: always()
        run: node tests/screen-reader/summary.ts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speech-${{ matrix.target }}-${{ matrix.group }}
          path: |
            packages/origami-ui/.acceptance-evidence/screen-reader/
            packages/origami-ui/recordings/
          include-hidden-files: true
          if-no-files-found: ignore
