name: Release gate

# Runs Origami's release gate (test:full) on every push to main. Publish refuses an
# Origami release unless this passed on the commit it releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  test-full:
    # A release commit only moves versions; Publish checks its nearest non-release ancestor.
    if: "!startsWith(github.event.head_commit.message, 'chore(release): ')"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NG_BUILD_MAX_WORKERS: 2
    defaults:
      run:
        working-directory: packages/origami-ui
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          pnpm_config_pm_on_fail: error
          pnpm_config_verify_deps_before_run: error
      # The runner is disposable, so the engines' host libraries come from apt.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:full
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: origami-release-evidence
          path: packages/origami-ui/.acceptance-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
