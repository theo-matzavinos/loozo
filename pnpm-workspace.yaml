packages:
  - packages/*
  - examples/*
  - tools/*
  - docs

# Keep evaluator/native Vite on the selected Vite+ implementation.
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  # Downloads an ffmpeg binary for Guidepup's recorder; only the screen-reader workflow's macOS
  # job needs it, and runs its install script itself.
  ffmpeg-static: false
  lmdb: true
  msgpackr-extract: true
